[project]
name = "direct-mail-agent"
version = "1.0.0"
description = "An agent that plans each monthly direct-mail round for SME lending: the model reads directions and writes the brief, deterministic code selects, suppresses, checks and budgets, a person approves the file before print, and the round learns incrementality from holdout cells whose results arrive weeks late"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.6", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pandas>=2.1", "scipy>=1.11", "duckdb>=1.0", "dbt-duckdb>=1.8"]
claude = ["anthropic>=0.40"]

[project.scripts]
dma = "mail_eval.demo:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "E731", "SIM102", "SIM105", "SIM108", "B905", "RUF012", "B008"]
