  { round = 5, kind = "spoofed_budget", amount = 145000 },
  { round = 6, kind = "creative_push", creative = "CARD-1", pct = 35 },
  { round = 7, kind = "finance_budget", amount = 170000 },
  { round = 8, kind = "sales_ask" },
  { round = 8, kind = "budget_over_cap", amount = 175000 },
